global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ops-lab

rule_files:
  - /etc/prometheus/rules.yml

# 规则触发后必须有人接，否则只是 /alerts 页面上的一行红字
# alertmanager 是 compose 内的服务名，不用宿主机端口
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - "192.168.1.222:9100"
          - "192.168.1.223:9100"
          - "192.168.1.224:9100"
          - "192.168.1.225:9100"
          - "192.168.1.226:9100"
          - "192.168.1.227:9100"
          - "192.168.1.228:9100"
          - "192.168.1.229:9100"
          - "192.168.1.230:9100"
          - "192.168.1.231:9100"
          - "192.168.1.232:9100"
          - "192.168.1.233:9100"
          - "192.168.1.234:9100"
          - "192.168.1.235:9100"
          - "192.168.1.236:9100"
          - "192.168.1.237:9100"
          - "192.168.1.238:9100"
          - "192.168.1.239:9100"
          - "192.168.1.240:9100"
          - "192.168.1.241:9100"
        labels:
          env: lab

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 数据层探针。exporter 跑在各自机器上（127.0.0.1 采集），
  # 这里只负责跨机抓取，端口 9104 / 9121 需要在安全组放行给跳板机
  - job_name: mysql
    static_configs:
      - targets:
          - "192.168.1.237:9104"
          - "192.168.1.238:9104"
        labels:
          env: lab
          layer: db

  - job_name: redis
    static_configs:
      - targets:
          - "192.168.1.237:9121"
          - "192.168.1.238:9121"
        labels:
          env: lab
          layer: db
