global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ops-lab

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - "192.168.1.222:9100"
          - "192.168.1.223:9100"
          - "192.168.1.224:9100"
          - "192.168.1.225:9100"
          - "192.168.1.226:9100"
          - "192.168.1.227:9100"
          - "192.168.1.228:9100"
          - "192.168.1.229:9100"
          - "192.168.1.230:9100"
          - "192.168.1.231:9100"
          - "192.168.1.232:9100"
          - "192.168.1.233:9100"
          - "192.168.1.234:9100"
          - "192.168.1.235:9100"
          - "192.168.1.236:9100"
          - "192.168.1.237:9100"
          - "192.168.1.238:9100"
          - "192.168.1.239:9100"
          - "192.168.1.240:9100"
          - "192.168.1.241:9100"
        labels:
          env: lab

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
