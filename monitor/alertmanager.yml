# Alertmanager 配置
# 位置：/opt/alertmanager/alertmanager.yml （容器内 /etc/alertmanager/alertmanager.yml）
# 改完执行：docker kill -s HUP alertmanager  或 docker compose restart alertmanager

global:
  resolve_timeout: 5m

# 路由：所有告警先按 alertname + instance 聚合，再按 severity 分流
route:
  receiver: webhook-file
  group_by: ['alertname', 'instance']
  group_wait: 10s          # 首次触发等 10s，把同一批告警攒成一条
  group_interval: 1m       # 同组新增告警的合并间隔
  repeat_interval: 4h      # 未恢复的告警每 4h 重发一次
  routes:
    # P1 立即发，不等聚合窗口；重复间隔缩短到 30 分钟
    - matchers: ['severity="P1"']
      receiver: webhook-file
      group_wait: 0s
      repeat_interval: 30m

receivers:
  # 落盘型接收器：POST 到宿主机上的 p2-webhook，按 JSON 行追加到日志
  # 生产环境换成企业微信/钉钉/邮件，只要替换这一段 config，路由不用动
  - name: webhook-file
    webhook_configs:
      - url: 'http://alert-webhook:5001/alerts'
        send_resolved: true      # 恢复通知也要发，否则无法判断告警是否结束

# 抑制规则：节点整体失联时，该节点上的磁盘/内存/负载告警全部静默
# 否则一次宕机会炸出 5 条告警，值班的人还得自己判断哪条是根因
inhibit_rules:
  - source_matchers: ['alertname="NodeDown"']
    target_matchers: ['severity=~"P2|P3"']
    equal: ['instance']
