---
# 首次接入一台全新机器时跑这个（只有这一步需要 root 身份）。
#
#   ansible-playbook -i inventory playbooks/bootstrap.yml -e ansible_user=root --limit <单台先验>
#   ansible-playbook -i inventory playbooks/bootstrap.yml -e ansible_user=root
#
# 原因：harden.yml 要创建 ops 用户并铺公钥，而新机器上还没有 ops。
# ops 建好之后，其余全部配置走 site.yml（ops + sudo，全链路有审计）。

- import_playbook: harden.yml
